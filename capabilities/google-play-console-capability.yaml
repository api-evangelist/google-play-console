naftiko: 1.0.0-alpha2
info:
  label: Google Play Console Developer Reporting Google Play Developer Reporting API
  description: The Play Developer Reporting API provides programmatic access to Play Console reporting data, including app
    quality metrics such as crash rates, ANR rates, and other performance indicators.
  tags:
  - Google
  - Play
  - Console
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: google-play-console
    baseUri: https://playdeveloperreporting.googleapis.com
    description: Google Play Console Developer Reporting Google Play Developer Reporting API HTTP API.
    authentication:
      type: bearer
      token: '{{GOOGLE_PLAY_CONSOLE_TOKEN}}'
    resources:
    - name: v1alpha1-apps-search
      path: /v1alpha1/apps:search
      operations:
      - name: searchapps
        method: GET
        description: Google Play Console Developer Reporting Search apps
        inputParameters:
        - name: pageSize
          in: query
          type: integer
        - name: pageToken
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1alpha1-name-crashratemetricset
      path: /v1alpha1/{name}/crashRateMetricSet
      operations:
      - name: getcrashratemetricset
        method: GET
        description: Google Play Console Developer Reporting Get crash rate metric set
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1alpha1-name-anrratemetricset
      path: /v1alpha1/{name}/anrRateMetricSet
      operations:
      - name: getanrratemetricset
        method: GET
        description: Google Play Console Developer Reporting Get ANR rate metric set
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1alpha1-name-errorcountmetricset
      path: /v1alpha1/{name}/errorCountMetricSet
      operations:
      - name: geterrorcountmetricset
        method: GET
        description: Google Play Console Developer Reporting Get error count metric set
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: google-play-console-rest
    description: REST adapter for Google Play Console Developer Reporting Google Play Developer Reporting API.
    resources:
    - path: /v1alpha1/apps:search
      name: searchapps
      operations:
      - method: GET
        name: searchapps
        description: Google Play Console Developer Reporting Search apps
        call: google-play-console.searchapps
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1alpha1/{name}/crashRateMetricSet
      name: getcrashratemetricset
      operations:
      - method: GET
        name: getcrashratemetricset
        description: Google Play Console Developer Reporting Get crash rate metric set
        call: google-play-console.getcrashratemetricset
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1alpha1/{name}/anrRateMetricSet
      name: getanrratemetricset
      operations:
      - method: GET
        name: getanrratemetricset
        description: Google Play Console Developer Reporting Get ANR rate metric set
        call: google-play-console.getanrratemetricset
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1alpha1/{name}/errorCountMetricSet
      name: geterrorcountmetricset
      operations:
      - method: GET
        name: geterrorcountmetricset
        description: Google Play Console Developer Reporting Get error count metric set
        call: google-play-console.geterrorcountmetricset
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: google-play-console-mcp
    transport: http
    description: MCP adapter for Google Play Console Developer Reporting Google Play Developer Reporting API for AI agent
      use.
    tools:
    - name: searchapps
      description: Google Play Console Developer Reporting Search apps
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-play-console.searchapps
      with:
        pageSize: tools.pageSize
        pageToken: tools.pageToken
      inputParameters:
      - name: pageSize
        type: integer
        description: pageSize
      - name: pageToken
        type: string
        description: pageToken
      outputParameters:
      - type: object
        mapping: $.
    - name: getcrashratemetricset
      description: Google Play Console Developer Reporting Get crash rate metric set
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-play-console.getcrashratemetricset
      with:
        name: tools.name
      inputParameters:
      - name: name
        type: string
        description: name
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: getanrratemetricset
      description: Google Play Console Developer Reporting Get ANR rate metric set
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-play-console.getanrratemetricset
      with:
        name: tools.name
      inputParameters:
      - name: name
        type: string
        description: name
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: geterrorcountmetricset
      description: Google Play Console Developer Reporting Get error count metric set
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-play-console.geterrorcountmetricset
      with:
        name: tools.name
      inputParameters:
      - name: name
        type: string
        description: name
        required: true
      outputParameters:
      - type: object
        mapping: $.
binds:
- namespace: env
  keys:
    GOOGLE_PLAY_CONSOLE_TOKEN: GOOGLE_PLAY_CONSOLE_TOKEN
